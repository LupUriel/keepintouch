function daysSince(d) {
  if (!d) return Infinity;
  return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
}

function daysUntil(s) {
  if (!s) return Infinity;
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var d = new Date(s); d.setHours(0, 0, 0, 0);
  return Math.round((d.getTime() - today.getTime()) / 86400000);
}

function monthsSince(d) {
  if (!d) return Infinity;
  var dt = new Date(d);
  var now = new Date();
  var months = (now.getFullYear() - dt.getFullYear()) * 12 + (now.getMonth() - dt.getMonth());
  if (now.getDate() < dt.getDate()) months -= 1;
  return months < 0 ? 0 : months;
}

// Date de la dernière rencontre conviviale (petit-déj, déjeuner, dîner, verre)
function lastRencontre(c) {
  var best = null;
  (c.interactions || []).forEach(function (x) {
    if (RENCONTRE_TYPES.indexOf(x.type) >= 0) {
      if (!best || x.date > best) best = x.date;
    }
  });
  return best;
}

function isSnoozed(c) {
  return !!(c.snoozedUntil && c.snoozedUntil > todayStr());
}

function getStatus(c) {
  if (isSnoozed(c)) return "ok";
  if (awaitingActive(c)) return "awaiting";
  var cyc = cycleFor(c);
  if (!cyc) return "ok";
  var m = monthsSince(lastRencontre(c));
  if (m === Infinity || m >= cyc.due) return "overdue";
  if (m >= cyc.warn) return "approaching";
  return "ok";
}

function addMonthsStr(n) {
  var d = new Date();
  d.setMonth(d.getMonth() + n);
  return d.toISOString().split("T")[0];
}

function addDaysStr(n) {
  var d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().split("T")[0];
}

function statusLabel(s) {
  if (s === "overdue") return "En retard";
  if (s === "awaiting") return "En attente de retour";
  if (s === "approaching") return "Bientôt";
  return "À jour";
}

// Interaction la plus récente (par date)
function latestInteraction(c) {
  var best = null;
  (c.interactions || []).forEach(function (x) {
    if (!best || x.date > best.date) best = x;
  });
  return best;
}

// Le contact est-il en attente d'un retour ? (dernière interaction marquée "en attente")
function isAwaiting(c) {
  var li = latestInteraction(c);
  return !!(li && li.awaitingResponse);
}

function daysAwaiting(c) {
  var li = latestInteraction(c);
  if (!li || !li.awaitingResponse) return -1;
  return daysSince(li.date);
}

function isRetry(c) {
  var li = latestInteraction(c);
  return !!(li && li.retryPending);
}

function daysRetry(c) {
  var li = latestInteraction(c);
  if (!li || !li.retryPending) return -1;
  return daysSince(li.date);
}

// Re-report manuel "+14 j" : la fiche est parquée en attente jusqu'à awaitingUntil
function isParked(c) {
  return !!(c.awaitingUntil && c.awaitingUntil > todayStr());
}
// Sollicitation en cours (balle dans leur camp) : fenêtre 14 j (en attente) / 21 j (nouvel échange) ou re-report manuel
function awaitingActive(c) {
  if (isParked(c)) return true;
  var da = daysAwaiting(c); if (da >= 0 && da < FOLLOWUP_DAYS) return true;
  var dr = daysRetry(c); if (dr >= 0 && dr < FOLLOWUP_RETRY_DAYS) return true;
  return false;
}
// Fenêtre expirée et non re-reportée : action requise
function awaitStale(c) {
  return daysAwaiting(c) >= FOLLOWUP_DAYS && !isParked(c);
}
function retryStale(c) {
  return daysRetry(c) >= FOLLOWUP_RETRY_DAYS && !isParked(c);
}

function fmtDate(s) {
  if (!s) return "Jamais";
  return new Date(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
}

function fmtAgo(d) {
  var days = daysSince(d);
  if (days === Infinity) return "Jamais";
  if (days < 60) return "Il y a " + String(days) + "j";
  return "Il y a " + String(monthsSince(d)) + " mois";
}

function norm(s) {
  return (s == null ? "" : String(s)).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function todayStr() {
  return new Date().toISOString().split("T")[0];
}

// Mois restants avant la prochaine rencontre due (négatif = en retard)
function monthsUntilDue(c) {
  var cyc = cycleFor(c);
  if (!cyc) return 999;
  var lr = lastRencontre(c);
  if (!lr) return -999;
  return cyc.due - monthsSince(lr);
}

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function displayName(c) {
  if (c.firstName || c.lastName) {
    var parts = [];
    if (c.firstName) parts.push(c.firstName);
    if (c.lastName) parts.push(c.lastName.toUpperCase());
    return parts.join(" ");
  }
  return c.name || "";
}

function sortName(c) {
  if (c.lastName) return c.lastName.toLowerCase();
  return (c.name || "").toLowerCase();
}

function typeLabel(t) {
  for (var i = 0; i < INTER_TYPES.length; i++) {
    if (INTER_TYPES[i].value === t) return INTER_TYPES[i].label;
  }
  return "";
}

function prioLabel(v) {
  for (var i = 0; i < PRIORITIES.length; i++) {
    if (PRIORITIES[i].value === v) return PRIORITIES[i].label;
  }
  return "";
}

function isClient(c) {
  return (c.category || "").toLowerCase() === "client";
}

function cycleFor(c) {
  if (c.inTransition) return { due: 6, warn: 5 };
  if (c.priority === "high") return { due: 6, warn: 5 };
  if (c.priority === "none") return null;
  if (c.priority === "low") return { due: 18, warn: 16 };
  return isClient(c) ? { due: 12, warn: 9 } : { due: 12, warn: 11 };
}


function initials(c) {
  var f = (c.firstName || "").trim();
  var l = (c.lastName || "").trim();
  if (f || l) return ((f[0] || "") + (l[0] || "")).toUpperCase();
  var n = (c.name || "").trim();
  if (!n) return "?";
  var parts = n.split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return n.slice(0, 2).toUpperCase();
}

  function updContact(id, updates, rootUpdates, baseContacts) {
    var newContacts = (baseContacts || contacts).map(function (c) {
      if (c.id !== id) return c;
      var copy = {};
      Object.keys(c).forEach(function (k) { copy[k] = c[k]; });
      var now = nowTS(); var fu = Object.assign({}, c.fieldsUpdatedAt || {}); var touched = false;
      var effectifFields = ["effectifTranche", "effectifAnnee", "effectifSiren", "effectifSource", "effectifDate", "effectifPrecis"];
      var effectifWrite = effectifFields.some(function (key) { return Object.prototype.hasOwnProperty.call(updates, key); });
      var procedureFields = ["procedureEtat", "procedureNature", "procedureDate", "procedureTribunal", "procedureCheckISO"];
      var procedureWrite = procedureFields.some(function (key) { return Object.prototype.hasOwnProperty.call(updates, key); });
      Object.keys(updates).forEach(function (k) {
        var oldV = c[k], newV = updates[k];
        copy[k] = newV;
        if (JSON.stringify(oldV === undefined ? null : oldV) !== JSON.stringify(newV === undefined ? null : newV)) { fu[k] = now; touched = true; }
      });
      if (effectifWrite) { effectifFields.forEach(function (key) { fu[key] = now; }); touched = true; }
      if (procedureWrite) { procedureFields.forEach(function (key) { fu[key] = now; }); touched = true; }
      if (touched) { copy.updatedAt = now; copy.fieldsUpdatedAt = fu; }
      return copy;
    });
    save(Object.assign({ contacts: newContacts, categories: categories }, rootUpdates || {}));
    return newContacts;

  async function buildStyledXlsx(headers, rows) {
    var wb = new ExcelJS.Workbook();
    var ws = wb.addWorksheet("Fichier", { views: [{ state: "frozen", ySplit: 1 }] });

    // Colonnes + largeurs (forme maison)
    ws.columns = headers.map(function (h, i) {
      var col = { header: h };
      if (EXPORT_COLW[i] != null) col.width = EXPORT_COLW[i];
      return col;
    });

    // En-tête : fond #115692, Aptos 10 blanc, aligné gauche-centré, bordures blanches (G/D/H)
    ws.getRow(1).eachCell(function (cell) {
      cell.font = { name: "Aptos", size: 10, bold: false, color: { argb: "FFFFFFFF" } };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF115692" } };
      cell.alignment = { horizontal: "left", vertical: "middle" };
      cell.border = {
        top: { style: "thin", color: { argb: EXPORT_HEADER_BORDER } },
        left: { style: "thin", color: { argb: EXPORT_HEADER_BORDER } },
        right: { style: "thin", color: { argb: EXPORT_HEADER_BORDER } }
      };
    });

    // Lignes de données : Aptos 10, quadrillage bleu, fond bleu clair sur A et E ; dates réelles (JJ/MM/AAAA)
    rows.forEach(function (r) {
      var row = ws.addRow(r);
      row.eachCell({ includeEmpty: true }, function (cell, col) {
        cell.font = EXPORT_BLACK_COLS[col]
          ? { name: "Aptos", size: 10 }
          : { name: "Aptos", size: 10, color: { argb: EXPORT_TEXT_COLOR } };
        cell.alignment = { vertical: "middle" };
        cell.border = {
          top: { style: "thin", color: { argb: EXPORT_DATA_BORDER } },
          left: { style: "thin", color: { argb: EXPORT_DATA_BORDER } },
          right: { style: "thin", color: { argb: EXPORT_DATA_BORDER } },
          bottom: { style: "thin", color: { argb: EXPORT_DATA_BORDER } }
        };
        if (EXPORT_FILL_COLS[col]) {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: EXPORT_AE_FILL } };
        }
        if (EXPORT_DATE_COLS[col] && cell.value) {
          var d = parseLocalDate(cell.value);
          if (d) { cell.value = d; cell.numFmt = "dd/mm/yyyy"; }
        }
      });
    });

    // Onglet "CCN de branche" (source du menu déroulant ; Domaine / IDCC / Libellé / Remarque)
    var ws2 = wb.addWorksheet("CCN de branche", { views: [{ state: "frozen", ySplit: 1 }] });
    ws2.getColumn(1).width = 42; ws2.getColumn(2).width = 8; ws2.getColumn(3).width = 58; ws2.getColumn(4).width = 52;
    ["Domaine", "IDCC", "CCN de branche", "Remarque"].forEach(function (h, i) {
      var hc = ws2.getCell(["A", "B", "C", "D"][i] + "1");
      hc.value = h;
      hc.font = { name: "Aptos", size: 10, bold: true, color: { argb: "FFFFFFFF" } };
      hc.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF115692" } };
      hc.alignment = { horizontal: "left", vertical: "middle" };
    });
    CCN_LIST.forEach(function (x, i) {
      var rr = i + 2;
      ws2.getCell("A" + rr).value = x.dom;
      ws2.getCell("B" + rr).value = x.idcc;
      ws2.getCell("C" + rr).value = x.lib;
      ws2.getCell("D" + rr).value = x.rem;
    });

    // Listes déroulantes : une par colonne, sur toute la plage des contacts
    var lastRow = rows.length + 1;
    if (lastRow >= 2) {
      Object.keys(EXPORT_DV).forEach(function (col) {
        ws.dataValidations.add(col + "2:" + col + lastRow, { type: "list", allowBlank: true, formulae: [EXPORT_DV[col]] });
      });
    }

    var buf = await wb.xlsx.writeBuffer();
    var blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "keep_in_touch_" + todayStr() + ".xlsx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }

      var ch = line[i];
      if (inQuotes) {
        if (ch === '"' && i + 1 < line.length && line[i + 1] === '"') {
          current += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          current += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
    }
    result.push(current.trim());
    return result;
  }

  function stripAccents(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function findCol(headers, keywords) {
    for (var i = 0; i < headers.length; i++) {
      var h = stripAccents(headers[i]);
      for (var k = 0; k < keywords.length; k++) {
        if (h.indexOf(stripAccents(keywords[k])) >= 0) return i;
      }
    }
    return -1;
  }

  function colVal(vals, idx) {
    if (idx < 0 || idx >= vals.length) return "";
    return vals[idx] || "";
  }

  function parsePriority(val) {
    if (!val) return "medium";
    var v = val.toLowerCase().trim();
    if (v === "élevé" || v === "eleve" || v === "high" || v === "haut") return "high";
    if (v === "faible" || v === "low" || v === "bas") return "low";
    if (v === "nulle" || v === "nul" || v === "none" || v === "aucune") return "none";
    return "medium";
  }

  function normalizeDate(val) {
    if (!val) return "";
    var s = String(val).trim();
    if (!s) return "";
    // Already YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    // DD/MM/YYYY or DD-MM-YYYY
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
    // MM/DD/YYYY (US)
    var m2 = s.match(/^(\d{4})[\/](\d{1,2})[\/](\d{1,2})/);
    if (m2) return m2[1] + "-" + m2[2].padStart(2, "0") + "-" + m2[3].padStart(2, "0");
    // Excel serial number (number of days since 1900-01-01)
    var num = Number(s);
    if (!isNaN(num) && num > 30000 && num < 60000) {
      var d = new Date((num - 25569) * 86400000);
      return d.toISOString().split("T")[0];
    }
    // Try native Date parse
    var d2 = new Date(s);
    if (!isNaN(d2.getTime()) && d2.getFullYear() > 1900) return d2.toISOString().split("T")[0];
    return s;
  }

  function parseRencontreType(val) {
    var t = stripAccents(String(val || "")).toLowerCase().trim();
    if (!t) return "dejeuner";
    if (t.indexOf("formation") >= 0) return "formation_repas";
    if (t.indexOf("conference") >= 0) return "conference_repas";
    if (t.indexOf("petit") >= 0) return "petitdej";
    if (t.indexOf("diner") >= 0) return "diner";
    if (t.indexOf("verre") >= 0 || t.indexOf("apero") >= 0 || t.indexOf("drink") >= 0) return "verre";
    return "dejeuner";
  }

  function parseContactType(val) {
    var t = stripAccents(String(val || "")).toLowerCase().trim();
    if (!t) return "autre";
    if (t.indexOf("message") >= 0 || t.indexOf("repondeur") >= 0 || t.indexOf("vocal") >= 0) return "appel_message";
    if (t.indexOf("echange") >= 0) return "appel_echange";
    if (t.indexOf("appel") >= 0 || t.indexOf("tel") >= 0 || t.indexOf("phone") >= 0 || t.indexOf("call") >= 0) return "appel_echange";
    if (t.indexOf("sms") >= 0 || t.indexOf("whatsapp") >= 0 || t.indexOf("texto") >= 0) return "sms";
    if (t.indexOf("mail") >= 0 || t.indexOf("courriel") >= 0) return "email";
    if (t.indexOf("linkedin") >= 0) return "linkedin";
    if (t.indexOf("formation") >= 0) return "formation";
    if (t.indexOf("reunion") >= 0 || t.indexOf("meeting") >= 0) return "reunion";
    if (t.indexOf("even") >= 0 || t.indexOf("salon") >= 0 || t.indexOf("conf") >= 0) return "evenement";
    return "autre";
  }

  function normalizePhone(raw) {
    if (!raw) return "";
    var s = String(raw).trim();
    if (!s) return "";
    var compact = s.replace(/[\s.\-()]/g, "");
    if (/^\+33\d{9}$/.test(compact)) compact = "0" + compact.slice(3);
    else if (/^0033\d{9}$/.test(compact)) compact = "0" + compact.slice(4);
    if (/^\+/.test(compact)) return s;
    var digits = compact.replace(/\D/g, "");
    if (digits.length === 9 && /^[1-9]/.test(digits)) digits = "0" + digits;
    if (digits.length === 10 && digits.charAt(0) === "0") {
      return digits.replace(/(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/, "$1 $2 $3 $4 $5");
    }
    return s;
  }

  function processImportRows(headerRow, dataRows) {
    var hd = headerRow.map(function (h) { return String(h || "").trim().toLowerCase(); });

    var iNom = findCol(hd, ["nom", "name"]);
    var iArch = findCol(hd, ["archive", "archivé", "archived"]);
    var iOrigin = findCol(hd, ["origine", "source", "apporteur"]);

    var iPrenom = findCol(hd, ["prénom", "prenom", "firstname", "first name"]);
    var iFonc = findCol(hd, ["fonction", "titre", "poste", "job", "title"]);
    var iEntr = findCol(hd, ["entreprise", "company", "societe", "société"]);
    var iLieuEx = findCol(hd, ["lieu d'exercice", "lieu d exercice", "work location", "ville exercice"]);
    var iEmail = findCol(hd, ["email", "mail", "e-mail", "courriel"]);
    var iPhonePro = findCol(hd, ["tel. pro", "tel pro", "telephone pro", "phone pro"]);
    var iPhonePerso = findCol(hd, ["tel. perso", "tel perso", "telephone perso", "phone perso", "portable", "mobile"]);
    var iPhone = findCol(hd, ["phone", "tel", "telephone", "téléphone"]);
    var iLinkedin = findCol(hd, ["linkedin", "profil linkedin"]);
    var iAddress = findCol(hd, ["adresse", "address", "adresse postale"]);
    var iTransition = findCol(hd, ["transition", "en transition"]);
    var iCat = findCol(hd, ["categ", "category"]);
    var iPrio = findCol(hd, ["priorit", "priority"]);
    var iSect = findCol(hd, ["ccn de branche", "ccn", "convention collective", "secteur", "sector", "branche"]);
    var iAnniv = findCol(hd, ["anniversaire", "birthday", "naissance"]);
    var iTags = findCol(hd, ["tag"]);
    var iNext = findCol(hd, ["prochaine", "next", "action"]);
    var iLieu = findCol(hd, ["lieu rencontre", "lieu de rencontre", "contexte"]);
    var iNotes = findCol(hd, ["note"]);
    var iRencontre = findCol(hd, ["derniere rencontre", "dernier repas", "last meeting", "last meal"]);
    var iRdvType = findCol(hd, ["type de rencontre", "type rencontre", "format rencontre"]);
    var iLastContact = findCol(hd, ["dernier contact", "last contact"]);
    var iContactType = findCol(hd, ["type de contact", "type contact", "format contact"]);
    var iKeyDates = findCol(hd, ["dates cles", "key dates"]);

    var nc = [];
    for (var i = 0; i < dataRows.length; i++) {
      var vals = dataRows[i].map(function (v) { return String(v == null ? "" : v).trim(); });
      var nm = vals[iNom] || "";
      if (!nm) continue;

      var catN = (iCat >= 0 && vals[iCat]) ? vals[iCat] : categories[0];
      if (categories.indexOf(catN) === -1) addCategory(catN);

      var tagsStr = (iTags >= 0 && vals[iTags]) ? vals[iTags] : "";
      var tagsArr = tagsStr ? tagsStr.split(";").map(function (t) { return t.trim(); }).filter(Boolean) : [];

      var firstName = (iPrenom >= 0 && vals[iPrenom]) ? vals[iPrenom] : "";
      var lastName = nm;
      var fullName = (firstName + " " + lastName).trim();

      var rdvVal = normalizeDate(iRencontre >= 0 ? vals[iRencontre] : "");
      var rdvType = parseRencontreType(iRdvType >= 0 ? vals[iRdvType] : "");
      var contactVal = normalizeDate(iLastContact >= 0 ? vals[iLastContact] : "");
      var contactType = parseContactType(iContactType >= 0 ? vals[iContactType] : "");
      var birthdayVal = normalizeDate(iAnniv >= 0 ? vals[iAnniv] : "");
      var keyDates = [];
      var kdRaw = (iKeyDates >= 0 ? vals[iKeyDates] : "") || "";
      if (kdRaw) {
        String(kdRaw).split(";").forEach(function (part) {
          var seg = part.trim(); if (!seg) return;
          var ci = seg.lastIndexOf(":");
          if (ci > 0) {
            var lbl = seg.slice(0, ci).trim();
            var dt = normalizeDate(seg.slice(ci + 1).trim());
            if (lbl && dt) keyDates.push({ label: lbl, date: dt });
          }
        });
      }

      var interactions = [];
      if (rdvVal) {
        interactions.push({ iid: makeId(), date: rdvVal, comment: "Importé depuis Excel", type: rdvType });
      }
      if (contactVal && contactVal !== rdvVal) {
        interactions.push({ iid: makeId(), date: contactVal, comment: "Importé depuis Excel", type: contactType });
      }
      interactions.sort(function (a, b) { return b.date.localeCompare(a.date); });

      nc.push({
        id: makeId() + "_" + i,
        name: fullName,
        lastName: lastName,
        firstName: firstName,
        jobTitle: (iFonc >= 0 ? vals[iFonc] : "") || "",
        company: (iEntr >= 0 ? vals[iEntr] : "") || "",
        workLocation: (iLieuEx >= 0 ? vals[iLieuEx] : "") || "",
        email: (iEmail >= 0 ? vals[iEmail] : "") || "",
        phone: normalizePhone((iPhone >= 0 ? vals[iPhone] : "") || ""),
        phonePro: normalizePhone((iPhonePro >= 0 ? vals[iPhonePro] : "") || ""),
        phonePerso: normalizePhone((iPhonePerso >= 0 ? vals[iPhonePerso] : "") || ""),
        linkedin: (iLinkedin >= 0 ? vals[iLinkedin] : "") || "",
        address: (iAddress >= 0 ? vals[iAddress] : "") || "",
        inTransition: (iTransition >= 0 && vals[iTransition]) ? vals[iTransition].toLowerCase() === "oui" : false,
        category: catN,
        priority: parsePriority(iPrio >= 0 ? vals[iPrio] : ""),
        sector: (iSect >= 0 ? vals[iSect] : "") || "",
        birthday: birthdayVal,
        tags: tagsArr,
        nextAction: (iNext >= 0 ? vals[iNext] : "") || "",
        metAt: (iLieu >= 0 ? vals[iLieu] : "") || "",
        notes: (iNotes >= 0 ? vals[iNotes] : "") || "",

        archived: iArch >= 0 && /^(oui|yes|true|vrai|x|1)$/i.test(String(vals[iArch] || "").trim()),
        origin: (iOrigin >= 0 ? vals[iOrigin] : "") || "",
        keyDates: keyDates,
        interactions: interactions,
        createdAt: todayStr()
      });
    }
    if (nc.length === 0) { alert("Aucun contact trouvé."); return; }
    var dupes = []; var uniques = [];
    nc.forEach(function (newC) {
      var isDupe = contacts.some(function (existC) {
        var sameName = (existC.name || "").toLowerCase().trim() === (newC.name || "").toLowerCase().trim();
        if (!sameName) return false;
        if (newC.company && existC.company) return existC.company.toLowerCase().trim() === newC.company.toLowerCase().trim();
        return true;
      });
      if (isDupe) { dupes.push(newC.name + (newC.company ? " (" + newC.company + ")" : "")); } else { uniques.push(newC); }
    });
    if (dupes.length > 0 && uniques.length > 0) {
      if (!confirm(String(dupes.length) + " doublon(s) détecté(s).\nImporter uniquement les " + String(uniques.length) + " nouveau(x) contact(s) ?")) return;
      save({ contacts: contacts.concat(uniques), categories: categories });
      alert(String(uniques.length) + " importé(s), " + String(dupes.length) + " doublon(s) ignoré(s).");
    } else if (dupes.length > 0) {
      alert("Tous les contacts existent déjà. Aucun import.");
    } else {
      save({ contacts: contacts.concat(nc), categories: categories });
      alert(String(nc.length) + " contact(s) importé(s) avec succès.");
    }
    setShowImp(false);
  }

  function handleImport(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var ext = file.name.split(".").pop().toLowerCase();

    if (ext === "xlsx" || ext === "xls") {
      if (typeof XLSX === "undefined") {
        alert("La bibliothèque Excel n'a pas pu se charger. Essayez avec un fichier CSV (dans Excel : Fichier > Enregistrer sous > CSV UTF-8).");
        e.target.value = "";
        return;
      }
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var data = new Uint8Array(ev.target.result);
          var wb = XLSX.read(data, { type: "array" });
          var wsName = wb.SheetNames[0];
          var ws = wb.Sheets[wsName];
          var allRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          if (allRows.length < 2) { alert("Fichier vide."); return; }
          processImportRows(allRows[0], allRows.slice(1));
        } catch (err) { alert("Erreur de lecture Excel: " + err.message); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function (ev) {
        try {
          var lines = ev.target.result.split("\n").filter(function (l) { return l.trim().length > 0; });
          if (lines.length < 2) { alert("Fichier vide."); return; }
          var headerRow = parseCSVLine(lines[0]);
          var dataRows = [];
          for (var i = 1; i < lines.length; i++) { dataRows.push(parseCSVLine(lines[i])); }
          processImportRows(headerRow, dataRows);
        } catch (err) { alert("Erreur: " + err.message); }
      };
      reader2.readAsText(file);
    }
    e.target.value = "";
  }

  /* ── Derived ── */
  var filtered = contacts.filter(function (c) {
    if (fCat !== "all" && c.category !== fCat) return false;
    if (fSta === "archived") { if (!c.archived) return false; }
    else if (c.archived) { return false; }
    else if (fSta === "transition") { if (!c.inTransition) return false; }
    else if (fSta === "never") { if ((c.interactions || []).some(function (x) { return RENCONTRE_TYPES.indexOf(x.type) >= 0; })) return false; }
    else if (fSta !== "all" && getStatus(c) !== fSta) return false;
    if (fPri !== "all" && c.priority !== fPri) return false;
    if (fTag !== "all" && (c.tags || []).indexOf(fTag) === -1) return false;
    if (fSec !== "all" && c.sector !== fSec) return false;
    if (fComp !== "all" && norm(c.company || "") !== norm(fComp)) return false;
    if (search) {
      var q = norm(search);
      var hay = KIT_PURE.contactHaystack(c);
      var hit = norm(hay).indexOf(q) >= 0;
      if (!hit) hit = KIT_PURE.matchesPhoneDigits(search, [c.phonePro, c.phonePerso, c.phone]);
      if (!hit) hit = (c.interactions || []).some(function (x) { return x.comment && norm(x.comment).indexOf(q) >= 0; });
      if (!hit) return false;
    }
    return true;
  }).sort(function (a, b) {
    var sa = getStatus(a) === "overdue" ? 0 : getStatus(a) === "approaching" ? 1 : 2;
    var sb = getStatus(b) === "overdue" ? 0 : getStatus(b) === "approaching" ? 1 : 2;
    if (sa !== sb) return sa - sb;
    var pri = function (c) {
      if (isClient(c)) return 1.5; // clients entre high/medium pour ne pas les enterrer
      return c.priority === "high" ? 0 : c.priority === "medium" ? 1 : c.priority === "low" ? 2 : 3;
    };
    var pa = pri(a), pb = pri(b);
    if (pa !== pb) return pa - pb;
    var rel = function (c) { var cy = cycleFor(c); var m = monthsSince(lastRencontre(c)); return (m === Infinity ? 999 : m) - (cy ? cy.due : 12); };
    return rel(b) - rel(a);
  });

  // Rencontres à programmer : zone d'alerte (>= 10 mois), hors profils reportés
  var rencontreList = activeContacts.filter(function (c) {
    if (isSnoozed(c)) return false;
    var cyc = cycleFor(c);
    if (!cyc) return false;
    return monthsSince(lastRencontre(c)) >= cyc.warn;
  }).sort(function (a, b) {
    var rel = function (c) { var cy = cycleFor(c); var m = monthsSince(lastRencontre(c)); return (m === Infinity ? 999 : m) - (cy ? cy.due : 12); };
    return rel(b) - rel(a) || KIT_PURE.effectifTieBreak(a, b);
  });

  // Relances en attente : dernière interaction marquée "en attente" depuis >= seuil
  var awaitingList = activeContacts.filter(function (c) {
    return awaitStale(c);
  }).sort(function (a, b) {
    return daysAwaiting(b) - daysAwaiting(a) || KIT_PURE.effectifTieBreak(a, b);
  });

  // À recontacter : dernière interaction marquée "nouvel échange" depuis >= seuil
  var retryList = activeContacts.filter(function (c) {
    return retryStale(c);
  }).sort(function (a, b) {
    return daysRetry(b) - daysRetry(a) || KIT_PURE.effectifTieBreak(a, b);
  });

  // Relances planifiées : rappels datés dus ou à venir sous 30 jours
  var followUpList = activeContacts.filter(function (c) {
    return c.followUpDate && daysUntil(c.followUpDate) <= 30;
  }).sort(function (a, b) {
    return daysUntil(a.followUpDate) - daysUntil(b.followUpDate) || KIT_PURE.effectifTieBreak(a, b);
  });

  var upcomingNow = new Date();
  var upcomingToday = String(upcomingNow.getFullYear()) + "-" + String(upcomingNow.getMonth() + 1).padStart(2, "0") + "-" + String(upcomingNow.getDate()).padStart(2, "0");
  var upcomingKDs = [];
  activeContacts.forEach(function (c) {
    (c.keyDates || []).forEach(function (kd) {
      var occ = KIT_PURE.nextAnnualOccurrence(kd.date, upcomingToday);
      if (occ && occ.daysLeft <= 30) {
        upcomingKDs.push({ label: kd.label, contactName: displayName(c), contactId: c.id, daysLeft: occ.daysLeft, date: occ.date });
      }
    });
  });
  upcomingKDs.sort(function (a, b) { return a.daysLeft - b.daysLeft; });

  var upcomingBdays = [];
  activeContacts.forEach(function (c) {
    if (!c.birthday) return;
    var occ = KIT_PURE.nextAnnualOccurrence(c.birthday, upcomingToday);
    if (occ && occ.daysLeft <= 30) {
      upcomingBdays.push({ contactName: displayName(c), contactId: c.id, daysLeft: occ.daysLeft, date: occ.date });
    }
  });
  upcomingBdays.sort(function (a, b) { return a.daysLeft - b.daysLeft; });

  var cleSemaineCourante = KIT_PURE.weekKey(upcomingToday);
  var voeuxImminents = upcomingBdays.filter(function (b) { return b.daysLeft <= 6; }).map(function (b) {
    return b.contactName + " — anniversaire" + (b.daysLeft === 0 ? " aujourd'hui" : " dans " + String(b.daysLeft) + " j");
  }).concat(upcomingKDs.filter(function (k) { return k.daysLeft <= 6; }).map(function (k) {
    return k.contactName + " — " + k.label + (k.daysLeft === 0 ? " aujourd'hui" : " dans " + String(k.daysLeft) + " j");
  }));
  var procedureList = activeContacts.filter(function (c) { return c.procedureEtat === "en-cours"; });
  var recapTotal = procedureList.length + followUpList.length + awaitingList.length + retryList.length + rencontreList.length + voeuxImminents.length;
  var recapVisible = KIT_PURE.recapGate(authed, data.settings.recapHebdo, recapFerme, localStorage.getItem("kitRecapSemaine"), cleSemaineCourante, recapTotal);
  var recapSections = KIT_PURE.recapSections([
    { titre: "⚠ Procédures collectives", items: procedureList.map(function (c) { return displayName(c) + " — " + (c.procedureNature || "Procédure collective") + " (" + (c.procedureDate || "date non renseignée") + ")"; }) },
    { titre: "Relances planifiées", items: followUpList.map(function (c) { var du = daysUntil(c.followUpDate); return displayName(c) + " — " + (du < 0 ? "en retard de " + String(Math.abs(du)) + " j" : du === 0 ? "échéance aujourd'hui" : "échéance " + KIT_PURE.formatDateFr(c.followUpDate)); }) },
    { titre: "Relances en attente", items: awaitingList.map(function (c) { return displayName(c) + " — en attente depuis " + String(daysAwaiting(c)) + " j"; }) },
    { titre: "À recontacter", items: retryList.map(function (c) { return displayName(c) + " — dernier échange il y a " + String(daysRetry(c)) + " j"; }) },
    { titre: "Rencontres à programmer", items: rencontreList.map(function (c) { return displayName(c); }) },
    { titre: "Vœux à prévoir", items: voeuxImminents }
  ], 5);

  function fermerRecap() {
    /* Stockage saturé : marqueur non écrit, le récapitulatif reviendra — mais la fermeture visuelle est garantie. */
    try { localStorage.setItem("kitRecapSemaine", cleSemaineCourante); } catch (eR) {}

  }

  function renderRecapModal() {

  var stTotal = activeContacts.length;
  var stOverdue = activeContacts.filter(function (c) { return getStatus(c) === "overdue"; }).length;
  var stAwaiting = activeContacts.filter(function (c) { return getStatus(c) === "awaiting"; }).length;
  var stApproaching = activeContacts.filter(function (c) { return getStatus(c) === "approaching"; }).length;
  var stOk = activeContacts.filter(function (c) { return getStatus(c) === "ok"; }).length;
  var stSuivies = activeContacts.filter(function (c) { return cycleFor(c) !== null; });
  var stOkS = stSuivies.filter(function (c) { return getStatus(c) === "ok"; }).length;
  var coverage = stSuivies.length > 0 ? Math.round(stOkS / stSuivies.length * 100) : 0;

  var monthlyData = [];
  var now = new Date();
  for (var mi = 5; mi >= 0; mi--) {
    var md = new Date(now.getFullYear(), now.getMonth() - mi, 1);
    var mKey = md.getFullYear() + "-" + String(md.getMonth() + 1).padStart(2, "0");
    var mLabel = md.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" });
    var mCount = 0;
    activeContacts.forEach(function (c) {
      (c.interactions || []).forEach(function (x) { if (x.date && x.date.indexOf(mKey) === 0) mCount++; });
    });
    monthlyData.push({ key: mKey, label: mLabel, count: mCount });
  }
  var maxMonthly = 1;
  monthlyData.forEach(function (m) { if (m.count > maxMonthly) maxMonthly = m.count; });

  // Rencontres (repas/verre) par trimestre — 4 derniers trimestres
  var quarterData = [];
  var nowQ = new Date();
  var curQ = Math.floor(nowQ.getMonth() / 3);
  for (var qi = 3; qi >= 0; qi--) {
    var qIndex = curQ - qi;
    var qYear = nowQ.getFullYear();
    while (qIndex < 0) { qIndex += 4; qYear -= 1; }
    var qStartMonth = qIndex * 3;
    var qStart = new Date(qYear, qStartMonth, 1);
    var qEnd = new Date(qYear, qStartMonth + 3, 1);
    var qCount = 0;
    activeContacts.forEach(function (c) {
      (c.interactions || []).forEach(function (x) {
        if (RENCONTRE_TYPES.indexOf(x.type) >= 0 && x.date) {
          var xd = new Date(x.date);
          if (xd >= qStart && xd < qEnd) qCount++;
        }
      });
    });
    quarterData.push({ label: "T" + String(qIndex + 1) + " " + String(qYear).slice(2), count: qCount });
  }
  var maxQuarter = 1;
  quarterData.forEach(function (q) { if (q.count > maxQuarter) maxQuarter = q.count; });

  /* ════ STYLES ════ */
  var ff = "system-ui, -apple-system, sans-serif";
  var ac = "#1B1B24";
  var abl = "#2F7C8C";
  var bd = "#E6E3DD";

  /* ════ RENDER HELPERS ════ */

  function renderStatusBadge(status) {
    var bg, color, dot, label;
    if (status === "overdue") { bg = "#FBEAE5"; color = "#9A3115"; dot = "#BE3C1A"; label = "En retard"; }
    else if (status === "awaiting") { bg = "#D5E8EC"; color = "#235C68"; dot = "#2F7C8C"; label = "En attente de retour"; }
    else if (status === "approaching") { bg = "#F1E3B4"; color = "#8A5E08"; dot = "#B5790B"; label = "Bientôt"; }
    else { bg = "#D2E5DD"; color = "#234A41"; dot = "#2F6055"; label = "À jour"; }
    return (
      <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 20, background: bg, color: color, fontSize: 11, fontWeight: 600 }}>
        <span style={{ width: 6, height: 6, borderRadius: "50%", background: dot }}></span>
        {label}
      </span>
    );
  }

  function renderCatBadge(catName) {
    var h = 0;
    for (var i = 0; i < catName.length; i++) h += catName.charCodeAt(i);
    h = h % 360;
    return (
      <span style={{ padding: "2px 8px", borderRadius: 4, background: "hsla(" + h + ",40%,50%,0.12)", color: "hsl(" + h + ",45%,35%)", fontSize: 11, fontWeight: 600, textTransform: "uppercase" }}>
        {catName}
      </span>
    );
  }

  function renderPrioBadge(value) {
    var p = PRIORITIES[2];
    for (var i = 0; i < PRIORITIES.length; i++) { if (PRIORITIES[i].value === value) { p = PRIORITIES[i]; break; } }
    return <span style={{ padding: "2px 8px", borderRadius: 4, background: p.bg, color: p.color, fontSize: 11, fontWeight: 600 }}>{p.label}</span>;
  }

  /* ════ VIEWS ════ */

  // ─── LOG MODAL ───
  function renderEffectifBadge(c) {
    var label = KIT_PURE.trancheLabel(c && c.effectifTranche);
    return label ? <span style={{ marginLeft: 6, display: "inline-block", padding: "2px 7px", borderRadius: 9, background: "#F1EFEB", color: "#5C5852", fontSize: 10.5, fontWeight: 600 }}>{label}</span> : null;
  }

    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(27,27,36,0.48)", zIndex: 1200, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={fermerEffectifModal}>
        <div style={{ background: "#fff", borderRadius: 12, padding: 20, width: "100%", maxWidth: 620, maxHeight: "85vh", overflowY: "auto", boxShadow: "0 16px 45px rgba(0,0,0,0.22)" }} onClick={function (e) { e.stopPropagation(); }}>

          <p style={{ margin: "0 0 14px", color: "#64748B", fontSize: 13 }}>{effectifModal.bodacc ? "Contrôle des procédures collectives pour « " + effectifModal.company + " »." : "Résultats pour « " + effectifModal.company + " » — choisis l'entité correspondante."}</p>
          {effectifModal.cp ? <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", margin: "0 0 12px" }}><span style={{ color: "#64748B", fontSize: 12 }}>{"affiné par " + effectifModal.cp}</span><button onClick={function () { var contact = contacts.filter(function (c) { return c.id === effectifModal.id; })[0]; if (contact) openEffectifSearch(contact, true); }} style={{ background: "transparent", color: ac, border: "1px solid " + bd, borderRadius: 7, padding: "5px 8px", fontSize: 11.5, fontWeight: 600, cursor: "pointer", fontFamily: ff }}>Élargir la recherche</button></div> : null}
          {effectifLoading ? <p style={{ fontSize: 13 }}>Recherche en cours…</p> : null}

              <span style={{ display: "block", marginTop: 3, color: "#475569", fontSize: 12 }}>{effectif + (candidate.annee_tranche_effectif_salarie ? " · " + String(candidate.annee_tranche_effectif_salarie) : "")}</span>
            </button>;
          })}
          <button onClick={fermerEffectifModal} style={{ marginTop: 16, background: "transparent", color: "#64748B", border: "1px solid " + bd, borderRadius: 8, padding: "8px 14px", cursor: "pointer", fontFamily: ff }}>Annuler</button>
        </div>
      </div>

  }

      </div>
    </div>;

      <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(15,23,42,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 16 }} onClick={closeLogModal}>

        </div>
      </div>

  }

            </div>

            {inviteCandidateResult.etat === "non-connecte" ? <div style={{ padding: 12, marginBottom: 12, borderRadius: 8, background: "#FFF7E6", color: "#7A5208", fontSize: 13 }}>{"Agenda non connecté — saisissez vos dates"}</div> : null}
            {inviteCandidateResult.etat === "erreur" ? <div style={{ padding: 12, marginBottom: 12, borderRadius: 8, background: "#FFF1ED", color: "#9A3412", fontSize: 13 }}>{"Agenda indisponible — saisissez vos dates"}</div> : null}
            {inviteCandidateResult.etat === "ok" && inviteCandidateResult.candidates.length === 0 ? <div style={{ padding: 12, marginBottom: 12, borderRadius: 8, background: "#FFF7E6", color: "#7A5208", fontSize: 13 }}>{"Aucune date disponible sur l'horizon — ajoutez des dates manuellement"}</div> : null}
            {inviteCandidateResult.etat === "ok" && inviteCandidateResult.candidates.length > 0 ? <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
              {inviteCandidateResult.candidates.map(function (d) {
                var active = inviteCandidateDates.indexOf(d) >= 0;
                return <button key={d} style={chip(active, true)} onClick={function () {
                  var next = active ? inviteCandidateDates.filter(function (x) { return x !== d; }) : inviteCandidateDates.concat([d]);
                  setInviteCandidateDates(next);
                  updateComposedDates(next, inviteManualDates);
                }}>{KIT_PURE.formatDateFr(d)}</button>;
              })}
            </div> : null}
            {inviteCandidateResult.etat !== "chargement" ? <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 6 }}>AJOUT MANUEL</label>

                <input type="date" value={inviteDate} onChange={function (e) { setInviteDate(e.target.value); }} style={{ flex: 1, padding: 9, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff }} />
                <button disabled={!inviteDate || inviteDates.length >= needDates || inviteDates.indexOf(inviteDate) >= 0} onClick={function () {
                  var nextManual = KIT_PURE.mergeDates(inviteManualDates, [inviteDate]);
                  setInviteManualDates(nextManual);
                  updateComposedDates(inviteCandidateDates, nextManual);
                  setInviteDate("");
                }} style={{ background: abl, color: "#fff", border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 600, cursor: "pointer", opacity: !inviteDate || inviteDates.length >= needDates || inviteDates.indexOf(inviteDate) >= 0 ? 0.5 : 1 }}>Ajouter</button>
              </div>
            </div> : null}
            {inviteDates.length > 0 ? <div>
              <p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 600, color: "#64748B" }}>DATES CHOISIES — APPUYEZ POUR RETIRER</p>
              {inviteDates.map(function (d) { return <button key={d} onClick={function () {
                var nextCandidates = inviteCandidateDates.filter(function (x) { return x !== d; });
                var nextManual = inviteManualDates.filter(function (x) { return x !== d; });
                setInviteCandidateDates(nextCandidates); setInviteManualDates(nextManual); updateComposedDates(nextCandidates, nextManual);
              }} style={{ display: "flex", width: "100%", justifyContent: "space-between", padding: "8px 0", border: "none", borderTop: "1px solid " + bd, background: "transparent", color: ac, fontSize: 13, cursor: "pointer", fontFamily: ff }}><span>{KIT_PURE.formatDateFr(d)}</span><span style={{ color: "#BE3C1A" }}>Retirer</span></button>; })}
            </div> : null}
          </div> : null}
          {inviteStep === "preview" ? <div>
            {inviteCanal === "mail" ? <div><label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>OBJET</label><input value={inviteObjet} onChange={function (e) { setInviteObjet(e.target.value); }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, marginBottom: 12 }} /></div> : null}
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>APERÇU MODIFIABLE</label>
            <textarea value={inviteCorps} onChange={function (e) { setInviteCorps(e.target.value); }} rows={12} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, lineHeight: 1.5, fontFamily: ff, resize: "vertical" }} />
            {mailTooLong ? <p style={{ margin: "8px 0 0", fontSize: 12, color: "#B5790B" }}>{"Message trop long pour un lien mail fiable : il sera copié."}</p> : null}
          </div> : null}
          <div style={{ display: "flex", gap: 10, marginTop: 20, justifyContent: "flex-end" }}>
            <button style={{ background: "transparent", color: ac, border: "1.5px solid " + bd, borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={inviteStep === "options" ? resetInvite : function () { setInviteStep(inviteStep === "preview" && needDates > 0 ? "dates" : "options"); }}>{"Retour"}</button>
            {inviteStep !== "preview" ? <button disabled={!hasCoord || (inviteStep === "dates" && (inviteDates.length !== needDates || inviteCandidateResult.etat === "chargement"))} style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: ff, opacity: !hasCoord || (inviteStep === "dates" && (inviteDates.length !== needDates || inviteCandidateResult.etat === "chargement")) ? 0.5 : 1 }} onClick={advanceInvite}>Continuer</button> :
              <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { launchInvite({ contactId: inviteId, type: inviteType, canal: inviteCanal, registre: inviteRegister, templateId: t.id, dates: inviteDates.slice(), objet: inviteObjet, corps: inviteCorps }); }}>{mainLabel}</button>}
          </div>
        </div>
      </div>
    );
  }

  // ─── FORM ───
  function pickCompany(name) {
    var up = (name || "").toUpperCase();
    setFCompany(up);
    setFCompFocus(false);
    var sibs = contacts.filter(function (c) { return c.company && norm(c.company) === norm(name); });
    if (!sibs.length) return;
    var consensus = function (getter) {
      var vals = sibs.map(getter).map(function (v) { return (v || "").trim(); }).filter(function (v) { return v; });
      if (!vals.length) return null;
      for (var i = 1; i < vals.length; i++) { if (vals[i] !== vals[0]) return null; }
      return vals[0];
    };
    var wl = consensus(function (c) { return c.workLocation; });
    var ad = consensus(function (c) { return c.address; });
    var sc = consensus(function (c) { return c.sector; });
    if (wl) setFWorkLoc(wl);
    if (ad) setFAddress(ad);
    if (sc) setFSec2(sc);
  }

  function renderForm() {
    var compSugg = fCompany.trim() ? allCompanies.filter(function (n) { return norm(n).indexOf(norm(fCompany)) >= 0 && norm(n) !== norm(fCompany); }).slice(0, 6) : [];
    var existing = null;
    if (view === "editContact") {
      for (var i = 0; i < contacts.length; i++) { if (contacts[i].id === selId) { existing = contacts[i]; break; } }
    }
    return (
      <div>
        <button style={{ background: "transparent", color: ac, border: "1.5px solid " + bd, borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff, marginBottom: 20 }} onClick={function () { existing ? setView("contact") : setView("dashboard"); }}>{"← Retour"}</button>
        <div style={{ background: "#fff", borderRadius: 12, border: "1px solid " + bd, padding: 24 }}>
          <h2 style={{ margin: "0 0 24px", fontSize: 22, color: ac }}>{existing ? "Modifier" : "Nouveau contact"}</h2>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>NOM *</label>
              <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} value={fLastName} onChange={function (e) { setFLastName(e.target.value.toUpperCase()); }} placeholder="DURAND" />
            </div>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>PRÉNOM</label>
              <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} value={fFirstName} onChange={function (e) { setFFirstName(e.target.value); }} placeholder="Marie" />
            </div>
          </div>

          <div style={{ marginBottom: 16, display: "flex", alignItems: "center", gap: 12 }}>
            <label style={{ fontSize: 13, fontWeight: 600, color: "#64748B", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }} onClick={function () { setFInTransition(false); }}>
              <span style={{ width: 18, height: 18, borderRadius: "50%", border: "2px solid " + (!fInTransition ? ac : bd), display: "inline-flex", alignItems: "center", justifyContent: "center" }}>{!fInTransition ? React.createElement("span", { style: { width: 10, height: 10, borderRadius: "50%", background: ac } }) : null}</span>
              {"En exercice"}
            </label>
            <label style={{ fontSize: 13, fontWeight: 600, color: "#64748B", cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }} onClick={function () { setFInTransition(true); }}>
              <span style={{ width: 18, height: 18, borderRadius: "50%", border: "2px solid " + (fInTransition ? "#786078" : bd), display: "inline-flex", alignItems: "center", justifyContent: "center" }}>{fInTransition ? React.createElement("span", { style: { width: 10, height: 10, borderRadius: "50%", background: "#786078" } }) : null}</span>
              {"En transition"}
            </label>
          </div>

          {!fInTransition ? React.createElement("div", null,
            React.createElement("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 } },
              React.createElement("div", null,
                React.createElement("label", { style: { display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 } }, "FONCTION"),
                React.createElement("input", { style: { width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }, value: fJobTitle, onChange: function (e) { setFJobTitle(e.target.value); }, placeholder: "Ex: DRH, Directeur général, DAF\u2026" })
              ),
              React.createElement("div", { style: { position: "relative" } },
                React.createElement("label", { style: { display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 } }, "ENTREPRISE"),
                React.createElement("input", { style: { width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }, value: fCompany, onChange: function (e) { setFCompany(e.target.value.toUpperCase()); }, onFocus: function () { setFCompFocus(true); }, onBlur: function () { setTimeout(function () { setFCompFocus(false); }, 150); }, placeholder: "Ex: RENAULT, SANOFI, CARREFOUR\u2026" }),
                (fCompFocus && compSugg.length > 0) ? React.createElement("div", { style: { position: "absolute", top: "calc(100% + 2px)", left: 0, right: 0, background: "#fff", border: "1px solid " + bd, borderRadius: 8, boxShadow: "0 6px 18px rgba(16,24,40,0.10)", zIndex: 60, maxHeight: 210, overflowY: "auto" } },
                  compSugg.map(function (nm) {

                    return React.createElement("div", { key: nm, className: "kit-row", onMouseDown: function (e) { e.preventDefault(); pickCompany(nm); }, style: { padding: "9px 12px", fontSize: 13, cursor: "pointer", borderBottom: "1px solid #F1EFEB", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 } },
                      React.createElement("span", null, nm),
                      React.createElement("span", { style: { fontSize: 11, color: "#94A3B8" } }, String(cnt) + (cnt > 1 ? " fiches" : " fiche"))
                    );
                  })
                ) : null
              )
            ),
            React.createElement("div", { style: { marginBottom: 16 } },
              React.createElement("label", { style: { display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 } }, "LIEU D'EXERCICE"),
              React.createElement("input", { style: { width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }, value: fWorkLoc, onChange: function (e) { setFWorkLoc(e.target.value); }, placeholder: "Ex: Paris La D\u00e9fense, Lyon Part-Dieu\u2026" })
            ),
            React.createElement("div", { style: { marginBottom: 16 } },
              React.createElement("label", { style: { display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 } }, "ADRESSE POSTALE"),
              React.createElement("input", { style: { width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }, value: fAddress, onChange: function (e) { setFAddress(e.target.value); }, placeholder: "Ex: 12 avenue des Champs-\u00c9lys\u00e9es, 75008 Paris" })
            )
          ) : null}

          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>EMAIL</label>
            <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} type="email" value={fEmail} onChange={function (e) { setFEmail(e.target.value); }} placeholder="prenom.nom@entreprise.fr" />

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>TÉLÉPHONE PRO</label>
              <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} type="tel" value={fPhonePro} onChange={function (e) { setFPhonePro(e.target.value); }} placeholder="01 23 45 67 89" />
            </div>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>TÉLÉPHONE PERSO</label>
              <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} type="tel" value={fPhonePerso} onChange={function (e) { setFPhonePerso(e.target.value); }} placeholder="06 12 34 56 78" />
            </div>
          </div>

          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>PROFIL LINKEDIN</label>
            <input style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} value={fLinkedin} onChange={function (e) { setFLinkedin(e.target.value); }} placeholder="Ex: https://www.linkedin.com/in/marie-durand" />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: ((fCatV || "").toLowerCase() === "client") ? "1fr" : "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div>
              <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>CATÉGORIE</label>
              <select style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} value={fCatV} onChange={function (e) { setFCatV(e.target.value); }}>
                {categories.map(function (c) { return <option key={c} value={c}>{c}</option>; })}

              {!showNewCat && <button style={{ marginTop: 6, background: "none", border: "none", color: abl, fontSize: 12, cursor: "pointer", fontFamily: ff }} onClick={function () { setShowNewCat(true); }}>{"+ Nouvelle catégorie"}</button>}

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

              <input style={{ flex: 1, minWidth: 130, padding: 8, borderRadius: 6, border: "1px solid " + bd, fontSize: 13, fontFamily: ff }} type="date" value={fKdDate} onChange={function (e) { setFKdDate(e.target.value); }} />
              <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: ff }} onClick={function () { if (fKdLabel.trim() && fKdDate) { setFKds(fKds.concat([{ label: fKdLabel.trim(), date: fKdDate }])); setFKdLabel(""); setFKdDate(""); } }}>{"+"}</button>

          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>DATE D'ANNIVERSAIRE</label>
            <input style={{ width: "100%", maxWidth: 220, padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} type="date" value={fBday} onChange={function (e) { setFBday(e.target.value); }} />

          </div>

          <div style={{ marginBottom: 24 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 5 }}>NOTES</label>
            <textarea style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box", resize: "vertical" }} rows={3} value={fNotes} onChange={function (e) { setFNotes(e.target.value); }} placeholder="Informations utiles…" />
          </div>

          <button style={{ width: "100%", background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "12px 20px", fontSize: 15, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { submitForm(existing ? existing.id : null); }}>{existing ? "Enregistrer" : "Créer le contact"}</button>
        </div>
      </div>
    );
  }

  // ─── DETAIL ───
  function renderDetail() {
    var c = null;
    for (var i = 0; i < contacts.length; i++) { if (contacts[i].id === selId) { c = contacts[i]; break; } }
    if (!c) return <p>Introuvable.</p>;
    var status = getStatus(c);
    var snoozed = isSnoozed(c);
    var lastRdv = lastRencontre(c);
    var rdvMonths = monthsSince(lastRdv);
    var cycC = cycleFor(c);
    var rdvColor = !cycC ? "#6E6A64" : rdvMonths >= cycC.due ? "#BE3C1A" : rdvMonths >= cycC.warn ? "#B5790B" : "#2F6055";
    var awaitDays = daysAwaiting(c);
    var awaiting = awaitDays >= 0;
    var awaitWarn = awaitDays >= FOLLOWUP_DAYS;
    var retryDays = daysRetry(c);
    var retrying = retryDays >= 0;
    var retryWarn = retryDays >= FOLLOWUP_RETRY_DAYS;
    var rawOverdue = !!cycC && rdvMonths >= cycC.warn;

    return (
      <div>
        <button style={{ background: "transparent", color: ac, border: "1.5px solid " + bd, borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff, marginBottom: 20 }} onClick={function () { setView("dashboard"); setSelId(null); }}>{"← Dashboard"}</button>

        <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #ECE9E3", padding: 20, marginBottom: 12, boxShadow: "0 1px 2px rgba(16,24,40,0.04)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
            <div style={{ display: "flex", gap: 14, alignItems: "flex-start", minWidth: 0 }}>
              <Avatar c={c} size={52} />
              <div style={{ minWidth: 0 }}>
              <h2 style={{ margin: "0 0 4px", fontSize: 24, color: ac }}>{displayName(c)}</h2>
              {c.inTransition ? (
                <p style={{ margin: "0 0 8px" }}><span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 20, background: "#EFE9EE", color: "#6B5468", fontSize: 12, fontWeight: 600, border: "1px solid #D7CAD4" }}>En transition</span></p>
              ) : (c.jobTitle || c.company || c.workLocation) ? (
                <p style={{ margin: "0 0 8px", fontSize: 14, color: "#475569" }}>
                  {c.jobTitle ? c.jobTitle : ""}
                  {c.jobTitle && c.company ? " — " : ""}
                  {c.company ? c.company : ""}
                  {(c.jobTitle || c.company) && c.workLocation ? " · " : ""}
                  {c.workLocation ? c.workLocation : ""}
                </p>
              ) : null}
              <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                {renderCatBadge(c.category)}
                {!isClient(c) ? renderPrioBadge(c.priority) : null}
                {snoozed ? <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10, border: "1px solid #CBD5E1", background: "#F1EFEB", color: "#64748B" }}>{"⏸ Reporté jusqu'au " + fmtDate(c.snoozedUntil)}</span> : renderStatusBadge(status)}
                {awaitStale(c) ? <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10, border: "1px solid #F4D6CB", background: "#FBEAE5", color: "#9A3115" }}>{"⚠ Relance due — " + String(awaitDays) + "j"}</span> : null}
                {invitationAwaiting(c) ? <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10, background: "#EAF3F5", color: "#235C68" }}>{"invitation envoyée le " + fmtDate(invitationAwaiting(c).date)}</span> : null}
                {retryStale(c) ? <span style={{ fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 10, border: "1px solid #9FCAD3", background: "#EAF3F5", color: "#235C68" }}>{"⚠ À recontacter — " + String(retryDays) + "j"}</span> : null}
                {c.sector ? <span style={{ fontSize: 11, color: "#64748B", background: "#F1EFEB", padding: "2px 8px", borderRadius: 4 }}>{c.sector}</span> : null}
              </div>
              {(c.tags || []).length > 0 ? (
                <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginTop: 8 }}>
                  {c.tags.map(function (t) { return <span key={t} style={{ padding: "2px 8px", borderRadius: 4, background: "#EDE9FE", color: "#5B21B6", fontSize: 11, fontWeight: 600 }}>{t}</span>; })}
                </div>
              ) : null}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ background: "transparent", color: ac, border: "1.5px solid " + bd, borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { initForm(c); setView("editContact"); }}>Modifier</button>
              <button style={{ background: "transparent", color: "#6E6A64", border: "1.5px solid #DDD7CB", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { c.archived ? unarchiveContact(c.id) : archiveContact(c.id); }}>{c.archived ? "D\u00e9sarchiver" : "Archiver"}</button>
              <button style={{ background: "transparent", color: "#BE3C1A", border: "1.5px solid #F4D6CB", borderRadius: 8, padding: "8px 14px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { if (confirm("Supprimer ?")) delContact(c.id); }}>Supprimer</button>
            </div>
          </div>

          <div style={{ marginTop: 20, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 12 }}>
            <div style={{ padding: 14, background: "#F4F2EE", borderRadius: 8 }}>
              <p style={{ margin: 0, fontSize: 11, color: "#6E6A64", fontWeight: 600 }}>DERNIÈRE RENCONTRE</p>
              <p style={{ margin: "4px 0 0", fontSize: 18, fontWeight: 700, color: rdvColor }}>{fmtAgo(lastRdv)}</p>
              <p style={{ margin: "2px 0 0", fontSize: 12, color: "#94A3B8" }}>{fmtDate(lastRdv)}</p>
              {(function () { var cy = cycleFor(c); return <p style={{ margin: "6px 0 0", fontSize: 11.5, color: "#6E6A64" }}>{cy ? "Cycle : " + String(cy.due) + " mois · alerte à " + String(cy.warn) : "Hors cycle (priorité nulle)"}</p>; })()}
            </div>
            {c.metAt ? <div style={{ padding: 14, background: "#F6F5F2", borderRadius: 8 }}><p style={{ margin: 0, fontSize: 11, color: "#64748B", fontWeight: 600 }}>LIEU DE RENCONTRE</p><p style={{ margin: "4px 0 0", fontSize: 14 }}>{c.metAt}</p></div> : null}
            {c.sector ? <div style={{ padding: 14, background: "#F6F5F2", borderRadius: 8 }}><p style={{ margin: 0, fontSize: 11, color: "#64748B", fontWeight: 600 }}>CCN DE BRANCHE</p><p style={{ margin: "4px 0 0", fontSize: 14 }}>{c.sector}</p></div> : null}
            {c.birthday ? <div style={{ padding: 14, background: "#FDF2F8", borderRadius: 8 }}><p style={{ margin: 0, fontSize: 11, color: "#9D174D", fontWeight: 600 }}>ANNIVERSAIRE</p><p style={{ margin: "4px 0 0", fontSize: 14 }}>{fmtDate(c.birthday)}</p></div> : null}
            {c.company ? <div style={{ padding: 14, background: "#F6F5F2", borderRadius: 8 }}><p style={{ margin: 0, fontSize: 11, color: "#64748B", fontWeight: 600 }}>EFFECTIF ENTREPRISE</p><p style={{ margin: "4px 0 8px", fontSize: 14 }}>{KIT_PURE.trancheLabel(c.effectifTranche) ? (c.effectifPrecis != null ? String(c.effectifPrecis) + " sal. · " : "") + KIT_PURE.trancheLabel(c.effectifTranche) + (c.effectifSource ? " (" + (c.effectifSource === "api" ? "SIRENE" : "manuel") + (c.effectifAnnee ? " " + String(c.effectifAnnee) : "") + ")" : "") : "Effectif non renseigné"}</p><div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}><button disabled={!navigator.onLine} title={!navigator.onLine ? "Recherche indisponible hors ligne" : ""} onClick={function () { c.effectifSiren ? refreshEffectif(c) : openEffectifSearch(c); }} style={{ background: "transparent", color: navigator.onLine ? ac : "#94A3B8", border: "1px solid " + bd, borderRadius: 7, padding: "6px 9px", fontSize: 11.5, fontWeight: 600, cursor: navigator.onLine ? "pointer" : "not-allowed", fontFamily: ff }}>{c.effectifSiren ? "Actualiser" : "Rechercher l'effectif"}</button><button onClick={function () { openManualEffectif(c); }} style={{ background: "transparent", color: ac, border: "1px solid " + bd, borderRadius: 7, padding: "6px 9px", fontSize: 11.5, fontWeight: 600, cursor: "pointer", fontFamily: ff }}>Saisir l'effectif</button>{c.effectifSiren ? <button disabled={!navigator.onLine} title={!navigator.onLine ? "Vérification indisponible hors ligne" : ""} onClick={function () { verifyBodacc(c); }} style={{ background: "transparent", color: navigator.onLine ? "#BE3C1A" : "#94A3B8", border: "1px solid " + (navigator.onLine ? "#BE3C1A" : bd), borderRadius: 7, padding: "6px 9px", fontSize: 11.5, fontWeight: 600, cursor: navigator.onLine ? "pointer" : "not-allowed", fontFamily: ff }}>Vérifier au BODACC</button> : null}</div></div> : null}
          </div>

          {c.procedureEtat === "en-cours" ? <div role="alert" style={{ marginTop: 14, padding: "12px 14px", background: "#FBEAE5", border: "1px solid #BE3C1A", borderRadius: 8, color: "#7C2D12", fontSize: 13.5, fontWeight: 600 }}>{"⚠ Procédure collective — " + (c.procedureNature || "nature non renseignée") + " — " + (c.procedureDate || "date non renseignée") + " — " + (c.procedureTribunal || "tribunal non renseigné")}</div> : c.procedureEtat === "cloturee" ? <p style={{ margin: "12px 0 0", color: "#6E6A64", fontSize: 12.5 }}>{"Procédure collective passée (" + (c.procedureDate || "date non renseignée") + ")"}</p> : null}

          {c.followUpDate ? (
            <div style={{ marginTop: 14, padding: "12px 14px", background: "#EAF3F5", borderRadius: 8, border: "1px solid #C7E0E6", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <div>
                <p style={{ margin: 0, fontSize: 11, color: "#235C68", fontWeight: 600 }}>{"📌 RELANCE PLANIFIÉE — " + fmtDate(c.followUpDate) + (daysUntil(c.followUpDate) <= 0 ? " (à faire)" : " (dans " + String(daysUntil(c.followUpDate)) + "j)")}</p>
                {c.followUpNote ? <p style={{ margin: "4px 0 0", fontSize: 14, color: "#1B1B24" }}>{c.followUpNote}</p> : null}
              </div>
              <button style={{ background: "transparent", color: "#235C68", border: "1.5px solid #9FCAD3", borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { updContact(c.id, { followUpDate: "", followUpNote: "" }); }}>{"Fait ✓"}</button>
            </div>
          ) : null}

          {snoozed ? (
            <div style={{ marginTop: 14, padding: "10px 14px", background: "#F1EFEB", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: "#64748B" }}>{"⏸ Alerte de rencontre reportée jusqu'au " + fmtDate(c.snoozedUntil)}</span>
              <button style={{ background: "transparent", color: ac, border: "1.5px solid " + bd, borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { cancelSnooze(c.id); }}>{"Réactiver l'alerte"}</button>
            </div>
          ) : rawOverdue ? (
            <div style={{ marginTop: 14, padding: "10px 14px", background: "#F4F2EE", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: "#6E6A64" }}>{"Profil non prioritaire ? Tu peux reporter l'alerte de rencontre."}</span>
              <button style={{ background: "transparent", color: "#5C5852", border: "1.5px solid #D8D2C6", borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { snoozeRencontre(c.id); }}>{"⏸ Reporter de " + String((cycleFor(c) || { due: 12 }).due) + " mois"}</button>
            </div>
          ) : null}

          {(awaitStale(c) || retryStale(c)) ? (
            <div style={{ marginTop: 14, padding: "10px 14px", background: "#EAF3F5", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: "#235C68" }}>{"Toujours sans réponse ? Tu peux patienter avant de relancer."}</span>
              <button style={{ background: "transparent", color: "#235C68", border: "1.5px solid #9FCAD3", borderRadius: 8, padding: "6px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { reAwait(c.id); }}>{"⏳ Encore en attente · +14 j"}</button>
            </div>
          ) : null}

          <div style={{ marginTop: 14 }}>
            <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { openInviteModal(c.id); }}>{"Proposer une rencontre"}</button>
          </div>
          {(c.email || c.phonePro || c.phonePerso || c.phone || c.linkedin) ? (
            <div style={{ marginTop: 14, display: "flex", gap: 10, flexWrap: "wrap" }}>
              {c.email ? (
                <a href={"mailto:" + encodeURIComponent(c.email)} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 16px", background: "#EAF3F5", borderRadius: 8, border: "1px solid #C7E0E6", color: abl, fontSize: 13, fontWeight: 600, textDecoration: "none", cursor: "pointer" }}>
                  {"✉ " + c.email}
                </a>
              ) : null}
              {c.phonePro ? (
                <a href={"tel:" + normalizePhone(c.phonePro).replace(/\s/g, "")} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 16px", background: "#E5EFEB", borderRadius: 8, border: "1px solid #D2E5DD", color: "#2F6055", fontSize: 13, fontWeight: 600, textDecoration: "none", cursor: "pointer" }}>
                  {"✆ Pro " + normalizePhone(c.phonePro)}
                </a>
              ) : null}
              {c.phonePerso ? (
                <a href={"tel:" + normalizePhone(c.phonePerso).replace(/\s/g, "")} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 16px", background: "#FDF2F8", borderRadius: 8, border: "1px solid #FBCFE8", color: "#9D174D", fontSize: 13, fontWeight: 600, textDecoration: "none", cursor: "pointer" }}>
                  {"✆ Perso " + normalizePhone(c.phonePerso)}
                </a>
              ) : null}
              {(!c.phonePro && !c.phonePerso && c.phone) ? (
                <a href={"tel:" + normalizePhone(c.phone).replace(/\s/g, "")} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 16px", background: "#E5EFEB", borderRadius: 8, border: "1px solid #D2E5DD", color: "#2F6055", fontSize: 13, fontWeight: 600, textDecoration: "none", cursor: "pointer" }}>
                  {"✆ " + normalizePhone(c.phone)}
                </a>
              ) : null}
              {c.linkedin ? (
                <a href={c.linkedin.indexOf("http") === 0 ? c.linkedin : "https://" + c.linkedin} target="_blank" rel="noopener noreferrer" style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "10px 16px", background: "#EAF3F5", borderRadius: 8, border: "1px solid #9FCAD3", color: "#235C68", fontSize: 13, fontWeight: 600, textDecoration: "none", cursor: "pointer" }}>
                  {"in LinkedIn"}
                </a>
              ) : null}
            </div>
          ) : null}

          {c.address ? (
            <div style={{ marginTop: 14, padding: 14, background: "#F6F5F2", borderRadius: 8, borderLeft: "3px solid " + bd }}>
              <p style={{ margin: 0, fontSize: 11, color: "#64748B", fontWeight: 600 }}>ADRESSE POSTALE</p>
              <p style={{ margin: "4px 0 0", fontSize: 14, lineHeight: 1.5 }}>{c.address}</p>
            </div>
          ) : null}

          {c.nextAction ? <div style={{ marginTop: 14, padding: 14, background: "#EAF3F5", borderRadius: 8, borderLeft: "3px solid " + abl }}><p style={{ margin: 0, fontSize: 11, color: abl, fontWeight: 600 }}>PROCHAINE ACTION</p><p style={{ margin: "4px 0 0", fontSize: 14 }}>{c.nextAction}</p></div> : null}

          {(c.keyDates || []).length > 0 ? (
            <div style={{ marginTop: 14, padding: 14, background: "#F4F2EE", borderRadius: 8, borderLeft: "3px solid #DDD7CB" }}>
              <p style={{ margin: "0 0 8px", fontSize: 11, color: "#6E6A64", fontWeight: 600 }}>DATES CLÉS</p>
              {c.keyDates.map(function (k, idx) { return <p key={idx} style={{ margin: "2px 0", fontSize: 13 }}>{k.label + " — " + fmtDate(k.date)}</p>; })}
            </div>
          ) : null}

          {c.origin ? <p style={{ margin: "12px 0 0", fontSize: 12.5, color: "#64748B" }}>{"Origine : "}<span style={{ color: "#1B1B24", fontWeight: 600 }}>{c.origin}</span></p> : null}
          {c.notes ? <div style={{ marginTop: 14, padding: 14, background: "#FAF0D4", borderRadius: 8, borderLeft: "3px solid #B5790B" }}><p style={{ margin: 0, fontSize: 11, color: "#8A5E08", fontWeight: 600 }}>NOTES</p><p style={{ margin: "6px 0 0", fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{c.notes}</p></div> : null}
        </div>

        <div style={{ background: "#fff", borderRadius: 12, border: "1px solid " + bd, padding: 16, marginBottom: 12, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: ac }}>Enregistrer :</span>
          <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { openLogModal(c.id); }}>{"Je l'ai contacté"}</button>
          <button style={{ background: "#EAF3F5", color: ac, border: "1px solid #9FCAD3", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { logInteraction(c.id, "", todayStr(), "dejeuner", false, false); }}>{"Déjeuner ✓"}</button>
        </div>

        <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #ECE9E3", padding: 20, boxShadow: "0 1px 2px rgba(16,24,40,0.04)" }}>
          <h3 style={{ margin: "0 0 16px", fontSize: 16, color: ac }}>Historique</h3>
          {(!c.interactions || c.interactions.length === 0) ? (
            <div style={{ textAlign: "center", padding: "24px 0" }}>
              <div style={{ fontSize: 30, marginBottom: 6 }}>{"🗒️"}</div>
              <p style={{ color: "#94A3B8", fontSize: 14, margin: 0 }}>Aucune interaction enregistrée.</p>
            </div>
          ) : (
            <div style={{ position: "relative" }}>
              {c.interactions.length > 1 ? <div style={{ position: "absolute", left: 15, top: 16, bottom: 16, width: 2, background: "#ECE9E3" }}></div> : null}
              {c.interactions.map(function (x, idx) {
                var typeInfo = null;
                for (var ti = 0; ti < INTER_TYPES.length; ti++) { if (INTER_TYPES[ti].value === x.type) { typeInfo = INTER_TYPES[ti]; break; } }
                var isRepas = RENCONTRE_TYPES.indexOf(x.type) >= 0;
                var pillBg = isRepas ? "#FAF0D4" : "#EAF3F5";
                var pillBorder = isRepas ? "#F1E3B4" : "#C7E0E6";
                return (
                  <div key={idx} style={{ display: "flex", gap: 14, padding: "8px 0", position: "relative" }}>
                    <div style={{ width: 32, height: 32, borderRadius: "50%", background: pillBg, border: "2px solid " + pillBorder, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, flexShrink: 0, zIndex: 1 }}>{typeInfo ? typeInfo.icon : "•"}</div>
                    <div style={{ flex: 1, paddingTop: 1 }}>
                      <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: "#334155" }}>
                        {typeInfo ? typeInfo.label : "Interaction"}
                        <span style={{ fontWeight: 500, color: "#94A3B8" }}>{" · " + fmtDate(x.date)}</span>
                        {x.awaitingResponse ? <span style={{ marginLeft: 6, fontSize: 10.5, color: "#235C68", background: "#EAF3F5", padding: "1px 6px", borderRadius: 8, fontWeight: 600 }}>{"⏳ en attente"}</span> : null}
                        {x.retryPending ? <span style={{ marginLeft: 6, fontSize: 10.5, color: "#235C68", background: "#EAF3F5", padding: "1px 6px", borderRadius: 8, fontWeight: 600 }}>{"🔁 nouvel échange"}</span> : null}
                      </p>
                      {x.comment ? <p style={{ margin: "3px 0 0", fontSize: 13.5, lineHeight: 1.5, color: "#475569" }}>{x.comment}</p> : null}
                    </div>
                    <div style={{ display: "flex", alignItems: "flex-start", flexShrink: 0 }}>
                      <button title="Modifier cette interaction" className="kit-btn" onClick={function () { openEditInteraction(c.id, x); }} style={{ background: "transparent", border: "none", color: "#64748B", cursor: "pointer", fontSize: 15, lineHeight: 1, padding: "2px 6px", fontFamily: ff }}>{"✏"}</button>
                      <button title="Supprimer cette interaction" className="kit-btn" onClick={function () { deleteInteraction(c.id, idx); }} style={{ background: "transparent", border: "none", color: "#CBD5E1", cursor: "pointer", fontSize: 15, lineHeight: 1, padding: "2px 6px", fontFamily: ff }}>{"✕"}</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ─── WEEK ───
  function renderWeek() {
    var allEmpty = followUpList.length === 0 && awaitingList.length === 0 && retryList.length === 0 && rencontreList.length === 0 && upcomingBdays.length === 0 && upcomingKDs.length === 0;
    return (
      <div>
        {renderNav()}
        <h2 style={{ margin: "0 0 6px", fontSize: 20, color: ac }}>{"À suivre"}</h2>
        <p style={{ margin: "0 0 20px", fontSize: 14, color: "#64748B" }}>Relances planifiées, relances en attente, rencontres à programmer, anniversaires et dates clés</p>

        {followUpList.length > 0 ? (
          <div style={{ background: "#EAF3F5", borderRadius: 12, border: "1px solid #9FCAD3", padding: 16, marginBottom: 12 }}>
            <h3 style={{ margin: "0 0 10px", fontSize: 14, color: "#235C68" }}>{"📌 Relances planifiées"}</h3>
            {followUpList.map(function (c, idx) {
              var du = daysUntil(c.followUpDate);
