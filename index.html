  // ─── STATS ───
  function renderCompanies() {
    var groups = {};
    activeContacts.forEach(function (c) {
      var nm = (c.company || "").trim(); if (!nm) return;
      var k = norm(nm);
      if (!groups[k]) groups[k] = { name: nm, list: [] };
      groups[k].list.push(c);
    });
    var rows = Object.keys(groups).map(function (k) { return groups[k]; });
    rows.sort(function (a, b) { return b.list.length - a.list.length || a.name.localeCompare(b.name); });
    var noComp = activeContacts.filter(function (c) { return !(c.company || "").trim(); }).length;
    return (
      <div>
        {renderNav()}
        <h2 style={{ margin: "0 0 6px", fontSize: 20, color: ac }}>Entreprises</h2>
        <p style={{ margin: "0 0 20px", fontSize: 14, color: "#64748B" }}>{String(rows.length) + " entreprise(s) \u00b7 " + String(noComp) + " fiche(s) sans entreprise"}</p>
        {rows.map(function (g) {
          var counts = { overdue: 0, awaiting: 0, approaching: 0, ok: 0 };
          g.list.forEach(function (c) { counts[getStatus(c)]++; });
          return (
            <div key={g.name} className="kit-card" style={{ background: "#fff", borderRadius: 14, border: "1px solid #ECE9E3", padding: "13px 16px", marginBottom: 9, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, boxShadow: "0 1px 2px rgba(16,24,40,0.04)" }} onClick={function () { setFComp(g.name); setView("dashboard"); }}>
              <div style={{ minWidth: 0 }}>
                <p style={{ margin: 0, fontSize: 14.5, fontWeight: 600, color: "#1B1B24", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{g.name}</p>
                <p style={{ margin: "3px 0 0", fontSize: 12, color: "#86837C" }}>{String(g.list.length) + " fiche(s)"}{(g.list.length === 1 && g.list.some(function (c) { return isClient(c); })) ? <span style={{ marginLeft: 6, fontSize: 10.5, color: "#9A3115", background: "#FBEAE5", padding: "1px 7px", borderRadius: 10, border: "1px solid #F4D6CB", fontWeight: 600 }}>{"compte mono-contact"}</span> : null}</p>
              </div>
              <div style={{ display: "flex", gap: 10, flexShrink: 0, fontSize: 12, fontWeight: 600 }}>
                {counts.overdue ? <span style={{ color: "#BE3C1A" }}>{"\u25cf " + String(counts.overdue)}</span> : null}
                {counts.awaiting ? <span style={{ color: "#2F7C8C" }}>{"\u25cf " + String(counts.awaiting)}</span> : null}
                {counts.approaching ? <span style={{ color: "#B5790B" }}>{"\u25cf " + String(counts.approaching)}</span> : null}
                {counts.ok ? <span style={{ color: "#2F6055" }}>{"\u25cf " + String(counts.ok)}</span> : null}
              </div>
            </div>
          );
        })}
        {rows.length === 0 ? <p style={{ fontSize: 14, color: "#64748B" }}>{"Aucune entreprise renseign\u00e9e pour l'instant."}</p> : null}
      </div>
    );
  }

  // ─── DASHBOARD ───
  function updateMeetingSettings(mutator) {
    var next = JSON.parse(JSON.stringify(data.settings || defaultSettings()));
    mutator(next); next.updatedAt = nowTS(); save({ settings: next });
  }
  function updateTemplate(id, field, value) {
    var next = (data.templates || defaultTemplates()).map(function (t) {
      if (t.id !== id) return t;
      var copy = Object.assign({}, t); copy[field] = value; copy.updatedAt = nowTS(); return copy;
    });
    save({ templates: next });
  }
  function resetTemplate(id) {
    var original = defaultTemplates().concat(defaultVoeuxTemplates()).find(function (t) { return t.id === id; });
    var next = (data.templates || defaultTemplates()).map(function (t) {
      return t.id === id ? Object.assign({}, original, { updatedAt: nowTS() }) : t;
    });
    save({ templates: next });
  }
  function renderDash() {
    return (

              </div>
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 4 }}>NOUVEAU MOT DE PASSE</label>
                <input type="password" value={newPwd} onChange={function (e) { setNewPwd(e.target.value); }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} />
              </div>
              <div>
                <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "#64748B", marginBottom: 4 }}>CONFIRMER</label>
                <input type="password" value={newPwd2} onChange={function (e) { setNewPwd2(e.target.value); }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1.5px solid " + bd, fontSize: 14, fontFamily: ff, boxSizing: "border-box" }} />
              </div>
              {pwdMsg ? <p style={{ margin: 0, fontSize: 13, fontWeight: 600, color: pwdMsg === "OK" ? "#2F6055" : "#BE3C1A" }}>{pwdMsg === "OK" ? "Mot de passe modifié." : pwdMsg}</p> : null}
              <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff, alignSelf: "flex-start" }} onClick={handleChangePwd}>Modifier</button>
            </div>
          </div>
        ) : null}

        {(lastExportDays === null || lastExportDays > 14) ? (
          <div style={{ background: "#FAF0D4", border: "1px solid #F1E3B4", borderRadius: 12, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 13, color: "#8A5E08", fontWeight: 600 }}>{lastExport ? "Dernier export JSON il y a " + String(lastExportDays) + " j \u2014 pense \u00e0 sauvegarder." : "Aucune sauvegarde JSON effectu\u00e9e sur cet appareil."}</span>
            <button className="kit-btn" style={{ background: "#B5790B", color: "#fff", border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: ff }} onClick={backupJSON}>Exporter maintenant</button>
          </div>
        ) : null}
        <div className="kit-stats">
          <div className="kit-btn" style={{ background: "#F1EFEB", borderRadius: 16, padding: "14px 10px", textAlign: "center", cursor: "pointer", border: "2px solid transparent" }} onClick={function () { setFSta("all"); }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#E6E3DD", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 7px", color: ac }}><StatIcon paths={STAT_ICONS.users} /></div>
            <p style={{ margin: 0, fontSize: 26, fontWeight: 500, color: ac, lineHeight: 1 }}>{String(stTotal)}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, fontWeight: 500, color: ac, opacity: 0.7 }}>Total</p>
          </div>
          <div className="kit-btn" style={{ background: "#FBEAE5", borderRadius: 16, padding: "14px 10px", textAlign: "center", cursor: "pointer", border: "2px solid " + (fSta === "overdue" ? "#BE3C1A" : "transparent") }} onClick={function () { setFSta(fSta === "overdue" ? "all" : "overdue"); }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#F4D6CB", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 7px", color: "#BE3C1A" }}><StatIcon paths={STAT_ICONS.alert} /></div>
            <p style={{ margin: 0, fontSize: 26, fontWeight: 500, color: "#BE3C1A", lineHeight: 1 }}>{String(stOverdue)}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, fontWeight: 500, color: "#BE3C1A", opacity: 0.8 }}>En retard</p>
          </div>
          <div className="kit-btn" style={{ background: "#EAF3F5", borderRadius: 16, padding: "14px 10px", textAlign: "center", cursor: "pointer", border: "2px solid " + (fSta === "awaiting" ? "#2F7C8C" : "transparent") }} onClick={function () { setFSta(fSta === "awaiting" ? "all" : "awaiting"); }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#D5E8EC", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 7px", color: "#2F7C8C" }}><StatIcon paths={STAT_ICONS.clock} /></div>
            <p style={{ margin: 0, fontSize: 26, fontWeight: 500, color: "#2F7C8C", lineHeight: 1 }}>{String(stAwaiting)}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, fontWeight: 500, color: "#2F7C8C", opacity: 0.85 }}>{"En attente"}</p>
          </div>
          <div className="kit-btn" style={{ background: "#FAF0D4", borderRadius: 16, padding: "14px 10px", textAlign: "center", cursor: "pointer", border: "2px solid " + (fSta === "approaching" ? "#B5790B" : "transparent") }} onClick={function () { setFSta(fSta === "approaching" ? "all" : "approaching"); }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#F1E3B4", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 7px", color: "#B5790B" }}><StatIcon paths={STAT_ICONS.calendar} /></div>
            <p style={{ margin: 0, fontSize: 26, fontWeight: 500, color: "#B5790B", lineHeight: 1 }}>{String(stApproaching)}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, fontWeight: 500, color: "#B5790B", opacity: 0.85 }}>Bientôt</p>
          </div>
          <div className="kit-btn" style={{ background: "#E5EFEB", borderRadius: 16, padding: "14px 10px", textAlign: "center", cursor: "pointer", border: "2px solid " + (fSta === "ok" ? "#2F6055" : "transparent") }} onClick={function () { setFSta(fSta === "ok" ? "all" : "ok"); }}>
            <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#D2E5DD", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 7px", color: "#2F6055" }}><StatIcon paths={STAT_ICONS.check} /></div>
            <p style={{ margin: 0, fontSize: 26, fontWeight: 500, color: "#2F6055", lineHeight: 1 }}>{String(stOk)}</p>
            <p style={{ margin: "4px 0 0", fontSize: 12, fontWeight: 500, color: "#2F6055", opacity: 0.8 }}>{"À jour"}</p>
          </div>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          <input style={{ flex: 1, minWidth: 150, padding: "8px 12px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 13, fontFamily: ff, boxSizing: "border-box" }} placeholder="Rechercher…" value={search} onChange={function (e) { setSearch(e.target.value); }} />
            {fComp !== "all" ? <span style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#EAF3F5", color: "#235C68", border: "1px solid #C7E0E6", borderRadius: 8, padding: "7px 10px", fontSize: 12, fontWeight: 600 }}>{"\ud83c\udfe2 " + fComp}<span style={{ cursor: "pointer", fontWeight: 700 }} onClick={function () { setFComp("all"); }}>{"\u2715"}</span></span> : null}
          <select style={{ padding: "8px 10px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 12, fontFamily: ff }} value={fCat} onChange={function (e) { setFCat(e.target.value); }}>
            <option value="all">Catégorie</option>
            {categories.map(function (c) { return <option key={c} value={c}>{c}</option>; })}
          </select>
          <select style={{ padding: "8px 10px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 12, fontFamily: ff }} value={fSta} onChange={function (e) { setFSta(e.target.value); }}>
            <option value="all">Statut</option>
            <option value="overdue">En retard</option>
            <option value="awaiting">{"En attente de retour"}</option><option value="archived">Archivés</option><option value="transition">En transition</option><option value="never">Jamais rencontré·e</option>
            <option value="approaching">{"Bientôt"}</option>
            <option value="ok">{"À jour"}</option>
          </select>
          <select style={{ padding: "8px 10px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 12, fontFamily: ff }} value={fPri} onChange={function (e) { setFPri(e.target.value); }}>
            <option value="all">{"Priorité"}</option>
            {PRIORITIES.map(function (p) { return <option key={p.value} value={p.value}>{p.label}</option>; })}
          </select>
          {allTags.length > 0 ? (
            <select style={{ padding: "8px 10px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 12, fontFamily: ff }} value={fTag} onChange={function (e) { setFTag(e.target.value); }}>
              <option value="all">Tag</option>
              {allTags.map(function (t) { return <option key={t} value={t}>{t}</option>; })}
            </select>
          ) : null}
          {allSectors.length > 0 ? (
            <select style={{ padding: "8px 10px", borderRadius: 8, border: "1.5px solid " + bd, fontSize: 12, fontFamily: ff }} value={fSec} onChange={function (e) { setFSec(e.target.value); }}>
              <option value="all">CCN de branche</option>
              {allSectors.map(function (s) { return <option key={s} value={s}>{s}</option>; })}
            </select>
          ) : null}
        </div>

        {filtered.length === 0 ? (
          <div className="kit-card" style={{ background: "#fff", borderRadius: 14, border: "1px solid #ECE9E3", padding: "48px 24px", textAlign: "center", boxShadow: "0 1px 2px rgba(16,24,40,0.04)" }}>
            <div style={{ fontSize: 40, marginBottom: 10 }}>{contacts.length === 0 ? "👋" : "🔍"}</div>
            <p style={{ fontSize: 16, fontWeight: 700, color: ac, margin: "0 0 4px" }}>{contacts.length === 0 ? "Bienvenue dans Keep In Touch" : "Aucun résultat"}</p>
            <p style={{ margin: "0 0 16px", color: "#94A3B8", fontSize: 13.5 }}>{contacts.length === 0 ? "Commence par ajouter ton premier contact pour suivre tes relations." : "Aucun contact ne correspond à ces filtres."}</p>
            {contacts.length === 0 ? <button className="kit-btn" style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "10px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { initForm(null); setView("newContact"); }}>{"+ Ajouter un contact"}</button> : null}
          </div>
        ) : (
          filtered.map(function (c) {
            var status = getStatus(c);
            var lastRdv = lastRencontre(c);
            var rdvText = lastRdv ? "Dernière rencontre : " + fmtAgo(lastRdv).toLowerCase() : "Aucune rencontre";
            var awD = daysAwaiting(c);
            var awaiting = awD >= 0;
            var awaitWarn = awD >= FOLLOWUP_DAYS;
            var rtD = daysRetry(c);
            var retrying = rtD >= 0;
            var retryWarn = rtD >= FOLLOWUP_RETRY_DAYS;
            var fuDays = c.followUpDate ? daysUntil(c.followUpDate) : null;
            var fuActive = fuDays !== null && fuDays <= 30;
            var extra = "";
            if (c.workLocation) extra += " · " + c.workLocation;
            if (c.sector) extra += " · " + c.sector;
            if ((c.tags || []).length > 0) extra += " · " + c.tags.join(", ");
            return (
              <div key={c.id} className="kit-card" style={{ background: "#fff", borderRadius: 14, border: "1px solid #ECE9E3", borderLeft: "4px solid " + (c.archived ? "#B9B4AA" : statusColor(status)), padding: "14px 16px", marginBottom: 10, cursor: "pointer", boxShadow: "0 1px 2px rgba(16,24,40,0.04)" }} onClick={function () { setSelId(c.id); setView("contact"); }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
                  <Avatar c={c} size={42} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap", marginBottom: 2 }}>
                      <span style={{ fontSize: 15, fontWeight: 700, color: ac }}>{displayName(c)}</span>
                      {renderCatBadge(c.category)}
                      {c.inTransition ? <span style={{ fontSize: 10.5, color: "#6B5468", background: "#EFE9EE", padding: "1px 7px", borderRadius: 10, border: "1px solid #D7CAD4", fontWeight: 600 }}>En transition</span> : null}
                      {c.archived ? <span style={{ fontSize: 10.5, color: "#6E6A64", background: "#EEECE7", padding: "1px 7px", borderRadius: 10, border: "1px solid #DDD7CB", fontWeight: 600 }}>{"Archiv\u00e9"}</span> : null}
                      {c.priority ? renderPrioBadge(c.priority) : null}
                      {status === "awaiting" ? <span style={{ fontSize: 11, fontWeight: 600, padding: "1px 8px", borderRadius: 10, border: "1px solid #9FCAD3", background: "#D5E8EC", color: "#235C68" }}>{"⏳ En attente"}</span> : null}
                      {awaitStale(c) ? <span style={{ fontSize: 11, fontWeight: 600, padding: "1px 8px", borderRadius: 10, border: "1px solid #F4D6CB", background: "#FBEAE5", color: "#9A3115" }}>{"⚠ " + String(awD) + "j"}</span> : null}
                      {retryStale(c) ? <span style={{ fontSize: 11, fontWeight: 600, padding: "1px 8px", borderRadius: 10, border: "1px solid #9FCAD3", background: "#EAF3F5", color: "#235C68" }}>{"🔁 " + String(rtD) + "j"}</span> : null}
                      {fuActive ? <span style={{ fontSize: 11, fontWeight: 600, padding: "1px 8px", borderRadius: 10, border: "1px solid #9FCAD3", background: "#EAF3F5", color: "#235C68" }}>{"📌 " + (fuDays <= 0 ? "à faire" : String(fuDays) + "j")}</span> : null}
                    </div>
                    {(c.jobTitle || c.company) && !c.inTransition ? <p style={{ margin: "0 0 3px", fontSize: 12.5, color: "#475569" }}>{(c.jobTitle || "") + (c.jobTitle && c.company ? " — " : "") + (c.company || "")}</p> : null}
                    {c.nextAction ? <p style={{ margin: "2px 0 0", fontSize: 12, color: abl }}>{"→ " + c.nextAction}</p> : null}
                    <p style={{ margin: "3px 0 0", fontSize: 11.5, color: "#94A3B8" }}>{rdvText + extra}</p>
                  </div>
                  <button className="kit-btn" style={{ background: "#F1EFEB", color: ac, border: "none", borderRadius: 8, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: ff, flexShrink: 0 }} onClick={function (e) { e.stopPropagation(); openLogModal(c.id); }}>{"Contacté"}</button>
                </div>
              </div>
            );
          })
        )}
      </div>
    );
  }

  /* ════ MAIN RENDER ════ */
  var navItems = [
    { id: "dashboard", label: "Contacts", icon: "👤" },
    { id: "week", label: "À suivre", icon: "🔔", badge: followUpList.length + awaitingList.length + retryList.length + rencontreList.length },
    { id: "stats", label: "Stats", icon: "📊" },
    { id: "companies", label: "Entreprises", icon: "🏢" }
  ];
  var KIT_CSS = ".kit-card{transition:box-shadow .16s ease,transform .16s ease}.kit-card:hover{box-shadow:0 6px 18px rgba(16,24,40,.10);transform:translateY(-1px)}.kit-row:hover{background:#F6F5F2}.kit-btn{transition:opacity .15s ease,background .15s ease,border-color .15s ease}.kit-btn:hover{opacity:.88}.kit-fade{animation:kitfade .28s ease both}@keyframes kitfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.kit-bottomnav{display:none}@media(max-width:640px){.kit-topnav{display:none!important}.kit-bottomnav{display:flex!important}.kit-shell{padding-bottom:84px!important}}.kit-stats{display:grid;gap:10px;grid-template-columns:repeat(5,1fr);margin-bottom:18px}@media(max-width:640px){.kit-stats{grid-template-columns:repeat(6,1fr)}.kit-stats>div{grid-column:span 2}.kit-stats>div:nth-child(4){grid-column:2/span 2}.kit-stats>div:nth-child(5){grid-column:4/span 2}}";

  function renderBottomNav() {
    return (
      <div className="kit-bottomnav" style={{ position: "fixed", left: 0, right: 0, bottom: 0, background: "rgba(255,255,255,0.96)", backdropFilter: "blur(8px)", borderTop: "1px solid " + bd, padding: "6px 8px calc(6px + env(safe-area-inset-bottom))", justifyContent: "space-around", alignItems: "stretch", zIndex: 900, boxShadow: "0 -2px 12px rgba(16,24,40,0.05)" }}>
        {navItems.map(function (it) {
          var active = view === it.id || (it.id === "dashboard" && (view === "contact" || view === "newContact" || view === "editContact"));
          return (
            <button key={it.id} className="kit-btn" onClick={function () { setView(it.id); setSelId(null); }} style={{ flex: 1, border: "none", background: "none", cursor: "pointer", fontFamily: ff, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "6px 4px", color: active ? abl : "#94A3B8", position: "relative" }}>
              <span style={{ fontSize: 18, lineHeight: 1, filter: active ? "none" : "grayscale(0.4) opacity(0.8)" }}>{it.icon}</span>
              <span style={{ fontSize: 11, fontWeight: active ? 700 : 600 }}>{it.label}</span>
              {it.badge ? <span style={{ position: "absolute", top: 2, right: "calc(50% - 22px)", background: "#BE3C1A", color: "#fff", fontSize: 9, fontWeight: 700, borderRadius: 8, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>{String(it.badge)}</span> : null}
            </button>
          );
        })}
      </div>
    );
  }

  return (
    <div className="kit-shell" style={{ fontFamily: ff, background: "#F6F7F9", minHeight: "100vh", color: "#1E293B", maxWidth: 900, margin: "0 auto", padding: (saveOk && !trackedFile.failed ? "16px" : "64px") + " 16px 80px" }}>
      <style>{KIT_CSS}</style>
      {!saveOk ? <div role="alert" style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 1100, background: "#BE3C1A", color: "#fff", padding: "12px 16px", textAlign: "center", fontSize: 13, fontWeight: 700, boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}>Vos dernières modifications n'ont pas pu être enregistrées — exportez une sauvegarde</div> : null}
      {saveOk && trackedFile.failed ? <div role="alert" style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 1100, background: "#BE3C1A", color: "#fff", padding: "12px 16px", textAlign: "center", fontSize: 13, fontWeight: 700, boxShadow: "0 2px 8px rgba(0,0,0,0.2)" }}>Le fichier suivi n'est plus accessible — re-choisissez-le</div> : null}
      {bulkProgress ? <div role="alert" style={{ position: "fixed", inset: 0, background: "rgba(27,27,36,0.55)", zIndex: 1300, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}><div style={{ background: "#fff", borderRadius: 12, padding: 24, maxWidth: 420, textAlign: "center" }}><p style={{ margin: "0 0 6px", fontSize: 15, fontWeight: 700, color: ac }}>Mise à jour des effectifs…</p><p style={{ margin: 0, fontSize: 13, color: "#475569" }}>{String(bulkProgress.done) + " / " + String(bulkProgress.total) + " — les fiches sont verrouillées pendant le lot pour éviter tout conflit."}</p></div></div> : null}
      {renderRecapModal()}
      {renderLogModal()}
      {renderEffectifModal()}
      {renderManualEffectifModal()}
      {renderVoeuxModal()}
      {renderInviteModal()}
      {renderDoubleInviteModal()}
      {renderPendingInviteModal()}
      {replayInvite ? <div style={{ position: "fixed", left: 16, right: 16, bottom: 76, zIndex: 950, display: "flex", justifyContent: "center", pointerEvents: "none" }}><div style={{ background: ac, color: "#fff", borderRadius: 10, padding: "9px 12px", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 5px 18px rgba(0,0,0,0.22)", pointerEvents: "auto", fontSize: 13 }}><span>Invitation non envoyée</span><button style={{ background: "#fff", color: ac, border: "none", borderRadius: 7, padding: "6px 10px", fontWeight: 700, cursor: "pointer", fontFamily: ff }} onClick={function () { restoreInvite(replayInvite); }}>Rejouer</button><button aria-label="Fermer" style={{ background: "transparent", color: "#fff", border: "none", cursor: "pointer", fontSize: 17 }} onClick={function () { setReplayInvite(null); }}>×</button></div></div> : null}
      {view === "dashboard" ? renderDash() : null}
      {view === "week" ? renderWeek() : null}
      {view === "stats" ? renderStats() : null}
      {view === "contact" ? renderDetail() : null}
      {view === "companies" ? renderCompanies() : null}
      {view === "newContact" ? renderForm() : null}
      {view === "editContact" ? renderForm() : null}
      {updReady ? (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 70, display: "flex", justifyContent: "center", zIndex: 60, pointerEvents: "none" }}>
          <div style={{ background: "#1B1B24", color: "#fff", borderRadius: 12, padding: "10px 16px", fontSize: 13, display: "flex", gap: 12, alignItems: "center", boxShadow: "0 6px 20px rgba(0,0,0,0.25)", pointerEvents: "auto" }}>
            <span>Nouvelle version disponible</span>
            <button style={{ background: "#fff", color: "#1B1B24", border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: ff }} onClick={function () { location.reload(); }}>Recharger</button>
          </div>
        </div>
      ) : null}
      {mergePrev ? (
        <div style={{ position: "fixed", inset: 0, background: "rgba(27,27,36,0.45)", zIndex: 80, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={function () { setMergePrev(null); }}>
          <div style={{ background: "#fff", borderRadius: 16, padding: 22, maxWidth: 480, width: "100%", maxHeight: "84vh", overflowY: "auto", fontFamily: ff }} onClick={function (e) { e.stopPropagation(); }}>
            <h3 style={{ margin: "0 0 10px", fontSize: 17, color: ac }}>Rapport de fusion</h3>
            <p style={{ margin: "0 0 14px", fontSize: 13.5, color: "#475569" }}>{String(mergePrev.res.report.added.length) + " fiche(s) ajout\u00e9e(s) \u00b7 " + String(mergePrev.res.report.updated.length) + " mise(s) \u00e0 jour \u00b7 " + String(mergePrev.res.report.interAdded) + " interaction(s) ajout\u00e9e(s)"}</p>
            {mergePrev.res.report.added.length ? <div style={{ marginBottom: 10 }}><p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 700, color: "#2F6055" }}>AJOUTS</p>{mergePrev.res.report.added.map(function (x) { return <p key={x.id} style={{ margin: 0, fontSize: 13 }}>{x.label}</p>; })}</div> : null}
            {mergePrev.res.report.updated.length ? <div style={{ marginBottom: 10 }}><p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 700, color: "#235C68" }}>{"MISES \u00c0 JOUR"}</p>{mergePrev.res.report.updated.map(function (x) { return <p key={x.id} style={{ margin: 0, fontSize: 13 }}>{x.label + (x.fields.length ? " \u2014 " + x.fields.join(", ") : "") + (x.inter ? " \u00b7 +" + String(x.inter) + " interaction(s)" : "")}</p>; })}</div> : null}
            {mergePrev.res.report.conflicts.length ? <div style={{ marginBottom: 10, background: "#FAF0D4", borderRadius: 8, padding: "8px 10px" }}><p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 700, color: "#8A5E08" }}>{"CONFLITS (valeur du fichier retenue)"}</p>{mergePrev.res.report.conflicts.map(function (x, i) { return <p key={String(i)} style={{ margin: 0, fontSize: 12.5 }}>{x.label + " \u2014 " + x.field}</p>; })}</div> : null}
            {mergePrev.res.report.configuration.length ? <div style={{ marginBottom: 10, background: "#EAF3F5", borderRadius: 8, padding: "8px 10px" }}><p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 700, color: "#235C68" }}>CONFIGURATION</p>{mergePrev.res.report.configuration.map(function (x, i) { return <p key={String(i)} style={{ margin: 0, fontSize: 12.5 }}>{x}</p>; })}</div> : null}
            {mergePrev.res.report.pending.length ? <div style={{ marginBottom: 12, background: "#FBEAE5", borderRadius: 8, padding: "10px 12px" }}>
              <p style={{ margin: "0 0 4px", fontSize: 12, fontWeight: 700, color: "#9A3115" }}>{"SUPPRESSIONS \u00c0 CONFIRMER"}</p>
              <p style={{ margin: "0 0 8px", fontSize: 12, color: "#9A3115" }}>{"Coch\u00e9 = la suppression est maintenue. D\u00e9coche pour restaurer la fiche."}</p>
              {mergePrev.res.report.pending.map(function (p) {
                return <label key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, padding: "3px 0", cursor: "pointer" }}>
                  <input type="checkbox" checked={mergePrev.checked[p.id] !== false} onChange={function (e) { var ck = Object.assign({}, mergePrev.checked); ck[p.id] = e.target.checked; setMergePrev({ res: mergePrev.res, checked: ck }); }} />
                  <span>{p.label}</span>
                  <span style={{ color: "#94A3B8", fontSize: 11.5 }}>{"supprim\u00e9e le " + fmtDate(p.deletedAt.slice(0, 10))}</span>
                </label>;
              })}
            </div> : null}
            {mergePrev.res.report.revived.length ? <p style={{ margin: "0 0 10px", fontSize: 12.5, color: "#64748B" }}>{"Conserv\u00e9e(s) car modifi\u00e9e(s) apr\u00e8s suppression : " + mergePrev.res.report.revived.map(function (x) { return x.label; }).join(", ")}</p> : null}
            <p style={{ margin: "0 0 14px", fontSize: 11.5, color: "#94A3B8" }}>{"Une sauvegarde de l'\u00e9tat actuel sera t\u00e9l\u00e9charg\u00e9e automatiquement avant l'application."}</p>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button style={{ background: "transparent", color: "#64748B", border: "1.5px solid " + bd, borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: ff }} onClick={function () { setMergePrev(null); }}>Annuler</button>
              <button style={{ background: ac, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: ff }} onClick={applyMerge}>Appliquer la fusion</button>
            </div>
          </div>
        </div>
      ) : null}
      {renderBottomNav()}
    </div>
  );
}

var root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(ProtectedApp));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      function watch(w) {
        if (!w) return;
        w.addEventListener("statechange", function () {
          if (w.state === "activated" && navigator.serviceWorker.controller) {
            window.dispatchEvent(new Event("kit-sw-updated"));
          }
        });
      }
      watch(reg.installing);
      reg.addEventListener("updatefound", function () { watch(reg.installing); });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") { reg.update().catch(function () {}); }
      });
    }).catch(function () {});
  });
}
</script>
</body>
</html>
